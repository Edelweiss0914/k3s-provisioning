<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K3s 프로비저닝 관리자</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; }

    header {
      background: #1a1a2e;
      color: white;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .container { max-width: 960px; margin: 32px auto; padding: 0 16px; }

    .card {
      background: white;
      border-radius: 10px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 { font-size: 17px; color: #1a1a2e; margin-bottom: 20px; border-bottom: 2px solid #e8e8e8; padding-bottom: 10px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }

    label { font-size: 13px; font-weight: 600; color: #444; }

    input, select {
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { outline: none; border-color: #4a6cf7; }

    .hint { font-size: 11px; color: #999; }

    .btn {
      padding: 11px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #4a6cf7; color: white; }
    .btn-danger  { background: #e74c3c; color: white; }
    .btn-info    { background: #2ecc71; color: white; }

    .btn-row { display: flex; gap: 10px; margin-top: 20px; }

    #result {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
      white-space: pre-wrap;
      display: none;
    }
    .result-ok    { background: #eafaf1; border: 1px solid #2ecc71; color: #1e8449; }
    .result-error { background: #fdf2f2; border: 1px solid #e74c3c; color: #c0392b; }

    .status-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
    .status-table th, .status-table td { padding: 9px 12px; border-bottom: 1px solid #eee; text-align: left; }
    .status-table th { background: #f8f9fa; font-weight: 600; color: #555; }

    .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-running { background: #eafaf1; color: #1e8449; }
    .badge-pending { background: #fef9e7; color: #b7950b; }
  </style>
</head>
<body>

<header>K3s 프로비저닝 관리자</header>

<div class="container">

  <!-- 프로비저닝 -->
  <div class="card">
    <h2>고객 서비스 프로비저닝</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>고객 ID (Namespace)</label>
        <input type="text" id="customer_id" placeholder="customer-a">
        <span class="hint">소문자, 숫자, 하이픈만 허용</span>
      </div>
      <div class="form-group">
        <label>서비스 이름</label>
        <input type="text" id="service_name" placeholder="web-service">
      </div>
      <div class="form-group">
        <label>CPU 제한</label>
        <select id="cpu_limit">
          <option value="200m">200m</option>
          <option value="500m">500m</option>
          <option value="1">1 Core</option>
        </select>
      </div>
      <div class="form-group">
        <label>메모리 제한</label>
        <select id="memory_limit">
          <option value="256Mi">256Mi</option>
          <option value="512Mi">512Mi</option>
          <option value="1Gi">1Gi</option>
        </select>
      </div>
      <div class="form-group">
        <label>Replica 수</label>
        <input type="number" id="replicas" value="1" min="1" max="5">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="provision()">프로비저닝</button>
    </div>
    <div id="result"></div>
  </div>

  <!-- 상태 조회 / 삭제 -->
  <div class="card">
    <h2>서비스 관리</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>고객 ID</label>
        <input type="text" id="manage_customer_id" placeholder="customer-a">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-info"   onclick="getStatus()">상태 조회</button>
      <button class="btn btn-danger" onclick="deprovision()">서비스 삭제</button>
    </div>
    <div id="status_result"></div>
  </div>

</div>

<script>
  const API = "";

  function showResult(id, data, ok) {
    const el = document.getElementById(id);
    el.style.display = "block";
    el.className = ok ? "result-ok" : "result-error";
    el.textContent = JSON.stringify(data, null, 2);
  }

  async function provision() {
    const body = {
      customer_id:   document.getElementById("customer_id").value.trim(),
      service_name:  document.getElementById("service_name").value.trim(),
      cpu_limit:     document.getElementById("cpu_limit").value,
      memory_limit:  document.getElementById("memory_limit").value,
      replicas:      parseInt(document.getElementById("replicas").value),
    };
    try {
      const res = await fetch(`${API}/provision`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      showResult("result", data, res.ok);
    } catch (e) {
      showResult("result", { error: e.message }, false);
    }
  }

  async function getStatus() {
    const id = document.getElementById("manage_customer_id").value.trim();
    try {
      const res = await fetch(`${API}/provision/${id}/status`);
      const data = await res.json();
      if (!res.ok) { showResult("status_result", data, false); return; }

      let html = "";

      if (data.pods.length) {
        html += "<b>Pods</b><table class='status-table'><tr><th>이름</th><th>상태</th><th>노드</th></tr>";
        data.pods.forEach(p => {
          const badge = p.status === "Running" ? "badge-running" : "badge-pending";
          html += `<tr><td>${p.name}</td><td><span class='badge ${badge}'>${p.status}</span></td><td>${p.node}</td></tr>`;
        });
        html += "</table><br>";
      }

      if (data.deployments.length) {
        html += "<b>Deployments</b><table class='status-table'><tr><th>이름</th><th>Ready</th></tr>";
        data.deployments.forEach(d => {
          html += `<tr><td>${d.name}</td><td>${d.ready}/${d.replicas}</td></tr>`;
        });
        html += "</table><br>";
      }

      if (data.services.length) {
        html += "<b>Services</b><table class='status-table'><tr><th>이름</th><th>ClusterIP</th><th>Port</th></tr>";
        data.services.forEach(s => {
          html += `<tr><td>${s.name}</td><td>${s.cluster_ip}</td><td>${s.port}</td></tr>`;
        });
        html += "</table>";
      }

      const el = document.getElementById("status_result");
      el.style.display = "block";
      el.className = "result-ok";
      el.innerHTML = html;
    } catch (e) {
      showResult("status_result", { error: e.message }, false);
    }
  }

  async function deprovision() {
    const id = document.getElementById("manage_customer_id").value.trim();
    if (!confirm(`'${id}' 서비스를 삭제하시겠습니까?`)) return;
    try {
      const res = await fetch(`${API}/provision/${id}`, { method: "DELETE" });
      const data = await res.json();
      showResult("status_result", data, res.ok);
    } catch (e) {
      showResult("status_result", { error: e.message }, false);
    }
  }
</script>
</body>
</html>
